<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Enterprise HR">
<title>Enterprise HR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14202B; --ink2:#24323F; --muted:#5A6876; --line:#E3E8ED; --line2:#C5CDD5; --bg:#F2F4F6; --card:#FFFFFF; --soft:#FAFBFC;
  --accent:#0F5E66; --accent-d:#0A4248; --accent-t:#E6F0F1;
  --ok:#1E7F4F; --ok-t:#E3F3EA; --bad:#B8320F; --bad-t:#FBE7E0; --warn:#8A5A00; --warn-t:#FCF1D6;
  --r:12px; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Layout */
#app{min-height:100%;display:flex}
.side{width:236px;flex-shrink:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:18px 12px 14px;position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden}
.brand{font-weight:700;font-size:17px;padding:4px 8px 18px}
.brand small{display:block;font-weight:400;font-size:12px;color:#A9B6C2}
.nav{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:#3A4B5A transparent}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:#3A4B5A;border-radius:3px}.nav::-webkit-scrollbar-track{background:transparent}
.nav a{display:flex;align-items:center;gap:10px;color:#D5DDE4;text-decoration:none;padding:8px 10px;border-radius:8px;min-height:40px;flex-shrink:0}
.nav a.on{background:var(--ink2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #4FB39A}
.nav a:hover{background:var(--ink2)}
.side .me{flex-shrink:0;margin-top:10px;border-top:1px solid #2D3D4B;padding:12px 8px 0;font-size:13px;background:var(--ink)}
.side .me b{display:block;font-size:14px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--ink);color:#fff;padding:14px 16px;display:none;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .t{font-weight:700;font-size:17px;flex:1}
.content{padding:20px 24px 90px;max-width:1100px;width:100%}
.tabbar{display:none}
@media (max-width:820px){
  .side{display:none}
  .top{display:flex}
  .content{padding:12px 12px 96px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font-size:11.5px;color:var(--muted);text-decoration:none;min-height:56px;justify-content:center}
  .tabbar a.on{color:var(--accent);font-weight:700}
  .tabbar a{position:relative} .tabbar .cnt{position:absolute;top:4px;left:calc(50% + 8px);margin:0!important;padding:1px 6px}
  .tabbar a .ic{line-height:0} .tabbar a .lb{white-space:nowrap}
  .tabbar a.on .ic{color:var(--accent)}
}

/* Components */
h1{font-size:22px;margin:0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{border-color:var(--accent);color:var(--accent)}
.btn.danger{border-color:#E8B4A0;color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea,.inp{min-height:42px;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:15px;background:#fff;color:var(--ink);font-weight:400}
.field textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.b-ok{background:var(--ok-t);color:var(--ok)} .b-bad{background:var(--bad-t);color:var(--bad)} .b-warn{background:var(--warn-t);color:var(--warn)}
.b-acc{background:var(--accent-t);color:var(--accent)} .b-mut{background:#EEF1F4;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
button.item:hover{border-color:var(--accent)}
.item .nm{font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:#fff;font-size:13px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:0 12px;min-height:38px;font-size:13px}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.scrollx{overflow-x:auto}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45}
.n-info{background:var(--accent-t);color:var(--accent-d)} .n-warn{background:var(--warn-t);color:#5C3D00} .n-bad{background:var(--bad-t);color:#7A2109}

/* Pase de lista */
.att-head{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.att-head select,.att-head input{background:var(--ink2);color:#fff;border:1px solid #3A4B5A;border-radius:8px;min-height:40px;padding:0 10px}
.prog{flex:1;height:8px;background:#2D3D4B;border-radius:99px;overflow:hidden}
.prog i{display:block;height:8px;background:#4FB39A;border-radius:99px}
.person{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.person.open{border-color:var(--accent)}
.person>button{width:100%;min-height:58px;display:flex;align-items:center;gap:12px;padding:10px 14px;background:none;border:0;text-align:left}
.dot{width:12px;height:12px;border-radius:99px;flex-shrink:0;border:2px solid #9AA7B3;background:#fff}
.person .body{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:14px;background:var(--soft)}
.att3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.att3 button{min-height:48px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid var(--line2);background:#fff}
.att3 .asistio{color:var(--ok)} .att3 .falta{color:var(--bad)} .att3 .retardo{color:var(--warn)}
.att3 .asistio.on{background:var(--ok);border-color:var(--ok);color:#fff}
.att3 .falta.on{background:var(--bad);border-color:var(--bad);color:#fff}
.att3 .retardo.on{background:var(--warn);border-color:var(--warn);color:#fff}
.att2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.att3 .permiso{color:#4453A8} .att3 .descanso{color:#56616C} .att3 .inactividad{color:#B23A0A}
.att3 .permiso.on{background:#4453A8;border-color:#4453A8;color:#fff}
.att3 .descanso.on{background:#56616C;border-color:#56616C;color:#fff}
.att3 .inactividad.on{background:#B23A0A;border-color:#B23A0A;color:#fff}
.att3 button:disabled,.att2 button:disabled{opacity:.6}
/* Cuadros formales del pase de lista */
.fbox{background:#fff;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.fbox>header,.modal .fbox>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 12px;background:#EEF1F4;border-bottom:1px solid var(--line2);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.fbox>header span{white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--muted)}
.fbox.risk{border-color:#E2A994}
.fbox.risk>header{background:var(--bad-t);border-bottom-color:#E2A994;color:#7A2109}
.fbox.risk>header span{color:var(--bad)}
.fbody{padding:12px;display:flex;flex-direction:column;gap:10px}
.aviso-row{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line2);padding-top:10px}
.aviso-row .hint{font-size:12px}
.att2 .aviso{min-height:40px;border-radius:8px;font-size:13px;font-weight:600;border:1px dashed var(--line2);background:#fff;color:var(--ink2)}
.att2 .aviso.on{border-style:solid;background:var(--ink);border-color:var(--ink);color:#fff}
.inc-note{border-left:3px solid var(--accent);background:var(--soft);padding:8px 10px;display:flex;flex-direction:column;gap:6px;border-radius:0 6px 6px 0}
.inc-note .btn{align-self:flex-start}
.req-list{display:flex;flex-direction:column}
.req-row{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 12px;background:#fff;border:0;border-top:1px solid var(--line);text-align:left;color:var(--ink)}
.req-row:first-child{border-top:0}
.req-row b{font-size:14px;font-weight:600}
.fbox>footer,.modal .fbox>footer{display:block;padding:8px 12px;border-top:1px solid var(--line);background:var(--soft);font-size:12px;color:var(--muted)}
.req-row .go{font-size:22px;color:var(--muted);line-height:1}
.req-row:hover{background:var(--soft)}
.req-row.risk b{color:var(--bad)}
.req-row.risk:hover{background:#FDF4F1}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
/* Evidencias en archivo */
.filebox{display:flex;flex-direction:column;gap:8px;grid-column:1/-1}
.fb-title{font-size:13px;font-weight:600}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:16px 12px;border:1.5px dashed var(--line2);border-radius:8px;background:var(--soft);cursor:pointer}
.drop:hover,.filebox.over .drop{border-color:var(--accent);background:var(--accent-t)}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.drop-ic{font-size:22px;color:var(--accent);line-height:1}
.flist{display:flex;flex-direction:column;gap:6px}
.fitem,.evid-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);text-decoration:none}
.fitem b,.evid-item b{display:block;font-size:14px;font-weight:600;word-break:break-word}
.fitem .grow>span,.evid-item .grow>span{display:block}
.fic{flex-shrink:0;width:40px;height:40px;border-radius:6px;background:#EEF1F4;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.04em}
.fitem .x{flex-shrink:0;width:36px;height:36px;border:0;background:none;font-size:22px;color:var(--muted);border-radius:6px}
.fitem .x:hover{background:var(--bad-t);color:var(--bad)}
.fbox.evid>header{align-items:center}
.fbox.evid>header .btn{text-transform:none;letter-spacing:0;min-height:34px}
.evid-list{display:flex;flex-direction:column;gap:6px;padding:10px}
.evid-item:hover{border-color:var(--accent)}
.evid-item[aria-disabled=true]{pointer-events:none;opacity:.7}
.evid-item.err{opacity:.6}
.evid-item .thumb{flex-shrink:0;width:48px;height:48px;object-fit:cover;border-radius:6px;background:#EEF1F4}
.evid-item .go{color:var(--muted)}
.turnos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.turnos button{min-height:50px;border-radius:8px;border:1px solid #3A4B5A;background:var(--ink2);color:#DDE5EC;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.turnos button span{font-size:11px;font-weight:500;color:#A9B6C2}
.turnos button.on{background:#fff;color:var(--ink);border-color:#fff}
.turnos button.on span{color:var(--muted)}
.att3 .salida{color:var(--warn)} .att3 .salida.on{background:var(--warn);border-color:var(--warn);color:#fff}
.morning-ref{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:#fff}
.morning-ref.diff{border-color:#E5C27A;background:var(--warn-t)}
.tbl.sub{background:#fff;border:1px solid var(--line);border-radius:8px}
.tbl.sub td,.tbl.sub th{padding:6px 8px}
.tbl tr.dif td{background:var(--warn-t)}
.add-person{width:100%;margin-top:10px;border-style:dashed}
.me .fb-btn{width:100%;margin-bottom:12px;background:none;color:#fff;border-color:#3A4B5A;justify-content:flex-start}
.me .fb-btn:hover{background:var(--ink2)}
.fb-seg{display:grid;grid-template-columns:1fr 1fr}
.fb-seg button{min-height:42px}
details.card summary{cursor:pointer}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.pick input{width:20px;height:20px;flex-shrink:0}
.pick b{display:block;font-weight:600}
.pick .grow>span{display:block}
.pick.on{border-color:var(--accent);background:var(--accent-t)}
.person .quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 14px 12px}
.person .quick button{min-height:42px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid var(--line2);background:#fff}
.person .quick .asistio{color:var(--ok)} .person .quick .falta{color:var(--bad)} .person .quick .retardo,.person .quick .salida{color:var(--warn)}
.person .quick .asistio.on{background:var(--ok);border-color:var(--ok);color:#fff}
.person .quick .falta.on{background:var(--bad);border-color:var(--bad);color:#fff}
.person .quick .retardo.on,.person .quick .salida.on{background:var(--warn);border-color:var(--warn);color:#fff}
.person .quick button:disabled{opacity:.55}
.person .more{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.nav a svg{flex-shrink:0;opacity:.9}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 4px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:88px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;text-align:center;line-height:1.2}
.tile svg{color:var(--accent)}
.tile:hover,.tile.on{border-color:var(--accent);background:var(--accent-t)}
.tile .cnt{position:absolute;top:6px;right:6px}
.modal-bg.sheet{align-items:flex-end;padding:0}
.modal-bg.sheet .modal{max-width:560px;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:821px){.modal-bg.sheet{align-items:center;padding:16px}.modal-bg.sheet .modal{border-radius:16px}}
.stickybar{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;margin-top:12px}
@media (max-width:820px){.stickybar{bottom:64px}}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,32,43,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal header h2{font-size:18px;margin:0;flex:1}
.modal .mb{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal .mb>*{flex-shrink:0}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;min-width:40px;min-height:40px;color:var(--muted)}
@media (max-width:560px){.modal-bg{align-items:flex-end;padding:0}.modal{border-radius:16px 16px 0 0;max-height:94vh}}
.ex-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.ex-ava{position:relative;width:84px;height:84px;border-radius:50%;background:var(--accent-t) center/cover no-repeat;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ex-ava.img{color:transparent}
.ex-cam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ex-acts{flex-basis:100%;border-top:1px solid var(--line);padding-top:10px}
.ex-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line2);margin-bottom:12px;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.ex-tabs button{border:0;background:none;padding:10px 14px;font-size:14px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px;cursor:pointer}
.ex-tabs button.on{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.ex-card{margin-bottom:12px}.ex-grid .ex-card{margin-bottom:0}
.ex-bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.ex-bar span{display:block;height:100%;background:var(--ok)}
.ex-file{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ex-file:last-child{border-bottom:0}
.ex-ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--warn-t);color:var(--warn);flex-shrink:0;font-weight:700}
.ex-ic.ok{background:var(--ok-t);color:var(--ok)}
.ex-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:520px}
.ex-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.ex-day{border:1px solid var(--line);border-radius:8px;min-height:44px;padding:3px 5px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;background:#fff}
.ex-day b{font-size:13px;text-align:right}.ex-day.off{opacity:.45;background:var(--soft)}.ex-day.hoy{outline:2px solid var(--accent)}
.ex-tl{border-left:2px solid var(--line2);padding-left:14px;display:flex;flex-direction:column;gap:12px}
